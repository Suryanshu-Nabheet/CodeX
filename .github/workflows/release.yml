name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            memory: 6144
          - os: macos-latest
            memory: 12288
          - os: windows-latest
            memory: 6144
    
    env:
      NODE_OPTIONS: "--max-old-space-size=${{ matrix.memory }}"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout CodeX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Compile CodeX Core
        run: npm run compile

      - name: Build CodeX Artifacts (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          # Build x64
          npm run gulp vscode-darwin-x64-min
          cd ../VSCode-darwin-x64 && zip -r ../CodeX-darwin-x64.zip .
          
          # Build arm64
          npm run gulp vscode-darwin-arm64-min
          cd ../VSCode-darwin-arm64 && zip -r ../CodeX-darwin-arm64.zip .

      - name: Build CodeX Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          npm run gulp vscode-linux-x64-min
          # Package as Tarballs
          cd ../VSCode-linux-x64 && tar -czf ../CodeX-linux-x64.tar.gz .
      
      - name: Build CodeX Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          npm run gulp vscode-win32-x64-min
          # Package as Zips
          cd ../VSCode-win32-x64; Compress-Archive -Path * -DestinationPath ../CodeX-win32-x64.zip

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ../CodeX-*.zip
            ../CodeX-*.tar.gz
          draft: false
          prerelease: false
          name: CodeX Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            
            This release contains the latest production build of CodeX for Windows, Mac, and Linux.
            
            Published on: ${{ github.event.head_commit.timestamp }}
            
            ### Installation:
            - **Windows**: Unzip `CodeX-win32-x64.zip` and run `codex.exe`.
            - **macOS (Intel)**: Unzip `CodeX-darwin-x64.zip`.
            - **macOS (Apple Silicon)**: Unzip `CodeX-darwin-arm64.zip`.
            - **Linux**: Extract `CodeX-linux-x64.tar.gz` and run `./codex`.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
