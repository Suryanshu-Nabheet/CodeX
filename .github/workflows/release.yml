name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x64
            os: macos-latest
            memory: 12288
            task: vscode-darwin-x64-min
            artifact: CodeX-darwin-x64.zip
            binary_dir: VSCode-darwin-x64
          - target: mac-arm64
            os: macos-latest
            memory: 12288
            task: vscode-darwin-arm64-min
            artifact: CodeX-darwin-arm64.zip
            binary_dir: VSCode-darwin-arm64
          - target: linux-x64
            os: ubuntu-latest
            memory: 6144
            task: vscode-linux-x64-min
            artifact: CodeX-linux-x64.tar.gz
            binary_dir: VSCode-linux-x64
          - target: win32-x64
            os: windows-latest
            memory: 6144
            task: vscode-win32-x64-min
            artifact: CodeX-win32-x64.zip
            binary_dir: VSCode-win32-x64

    env:
      NODE_OPTIONS: "--max-old-space-size=${{ matrix.memory }}"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout CodeX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Swap Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=~/swapfile bs=1M count=10240
          sudo chmod 600 ~/swapfile
          sudo mkswap ~/swapfile
          sudo swapon ~/swapfile

      - name: Install Build Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3

      - name: Install Dependencies
        run: npm install --no-audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CodeX React UI
        run: cd src/vs/workbench/contrib/codex/browser/react && node build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile CodeX Core
        run: npm run compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build CodeX Artifact
        run: node --max-old-space-size=${{ matrix.memory }} ./node_modules/gulp/bin/gulp.js ${{ matrix.task }}

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cd ../${{ matrix.binary_dir }}; Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact }}

      - name: Package Artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cd ../${{ matrix.binary_dir }} && tar -czf ../${{ matrix.artifact }} .

      - name: Package Artifact (macOS)
        if: startsWith(matrix.os, 'macos')
        run: cd ../${{ matrix.binary_dir }} && zip -r ../${{ matrix.artifact }} .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../${{ matrix.artifact }}
          draft: false
          prerelease: false
          name: CodeX Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            Published on: ${{ github.event.head_commit.timestamp }}

            ### Installation:
            - **Windows**: Unzip `CodeX-win32-x64.zip` and run `codex.exe`.
            - **macOS (Intel)**: Unzip `CodeX-darwin-x64.zip`.
            - **macOS (Apple Silicon)**: Unzip `CodeX-darwin-arm64.zip`.
            - **Linux**: Extract `CodeX-linux-x64.tar.gz` and run `./codex`.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
