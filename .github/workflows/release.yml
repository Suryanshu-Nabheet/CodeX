name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-x64
            os: macos-latest
            memory: 12288
            platform: darwin
            arch: x64
            artifact: CodeX-darwin-x64.dmg
            binary_dir: VSCode-darwin-x64
          - target: mac-arm64
            os: macos-latest
            memory: 12288
            platform: darwin
            arch: arm64
            artifact: CodeX-darwin-arm64.dmg
            binary_dir: VSCode-darwin-arm64
          - target: linux-x64
            os: ubuntu-latest
            memory: 12288
            platform: linux
            arch: x64
            artifact: CodeX-linux-x64.tar.gz
            binary_dir: VSCode-linux-x64
          - target: win32-x64
            os: windows-latest
            memory: 8192
            platform: win32
            arch: x64
            artifact: CodeX-win32-x64.zip
            binary_dir: VSCode-win32-x64

    env:
      NODE_OPTIONS: "--max-old-space-size=${{ matrix.memory }}"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout CodeX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Swap Space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo swapoff -a || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=10240
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          swapon --show

      - name: Install Build Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3

      - name: Install Dependencies
        run: npm install --no-audit

      - name: Build CodeX React UI
        run: cd src/vs/workbench/contrib/codex/browser/react && node build.js

      - name: Compile Source (out-build)
        run: npx gulp compile-build-without-mangling

      - name: Compile Non-Native Extensions
        run: npx gulp compile-non-native-extensions-build

      - name: Compile Extension Media
        run: npx gulp compile-extension-media-build

      - name: Bundle VSCode Core
        run: npx gulp bundle-vscode

      - name: Package CodeX (${{ matrix.target }})
        run: npx gulp vscode-${{ matrix.platform }}-${{ matrix.arch }}-ci

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: cd ../${{ matrix.binary_dir }}; Compress-Archive -Path * -DestinationPath ../${{ matrix.artifact }}

      - name: Package Artifact (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cd ../${{ matrix.binary_dir }} && tar -czf ../${{ matrix.artifact }} .

      - name: Ad-hoc codesign (.app)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --force --deep --sign - ../${{ matrix.binary_dir }}/CodeX.app || true

      - name: Create DMG (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p dmg_root
          cp -R ../${{ matrix.binary_dir }}/CodeX.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "CodeX" -srcfolder dmg_root -ov -format UDZO ../${{ matrix.artifact }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ../${{ matrix.artifact }}
          draft: false
          prerelease: false
          name: CodeX Release ${{ github.ref_name }}
          body: |
            ## CodeX ${{ github.ref_name }} - Production Ready

            A professional, AI-native fork of VS Code.

            ### 💻 Installation Guide
            - **Windows**: Unzip `CodeX-win32-x64.zip` and run `codex.exe`.
            - **macOS (Intel & Apple Silicon)**: Open the `.dmg` and drag **CodeX.app** to your **Applications** folder.
            - **Linux**: Extract `CodeX-linux-x64.tar.gz` and run `./codex`.

            ### 🍎 One-Time macOS Activation
            Since CodeX is an unsigned open-source project, macOS may show a "Damaged" warning. 
            **Move CodeX.app to Applications**, then run this in your terminal to enable it:
            `xattr -d com.apple.quarantine /Applications/CodeX.app`
          generate_release_notes: true
